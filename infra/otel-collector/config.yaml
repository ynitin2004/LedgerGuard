# OpenTelemetry Collector: receives OTLP from the API/workers, exposes metrics
# for Prometheus to scrape. Traces go to the debug exporter in M0; a trace
# backend (e.g. Tempo/Jaeger) is evaluated in M6 (docs/OBSERVABILITY.md).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: ledgerguard
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
