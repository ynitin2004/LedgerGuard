[project]
name = "ledgerguard-apps"
version = "0.0.0"
description = "LedgerGuard AI — API and worker processes (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = ["ledgerguard"]

[tool.uv]
package = false
# ml: training only (scripts/train_model.py, CI). The API never imports numpy/sklearn;
# Windows Application Control blocks numpy on the primary dev PC (ADR-021).
default-groups = ["dev", "ml"]

[tool.uv.workspace]
members = ["packages/ledgerguard"]

[tool.uv.sources]
ledgerguard = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
    "testcontainers>=4.8",
    "tzdata>=2026.6",
    # <6.156: 6.156.1+ ships a compiled extension that Windows Application Control blocks
    # on the primary dev PC (see the one-time section in CLAUDE.md). 6.155.x is pure Python.
    "hypothesis>=6.155,<6.156",
    "types-pyyaml>=6.0.12.20261113",
]
ml = [
    "numpy>=2.5.5",
    "scikit-learn>=1.9.1",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/ledgerguard/src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "DTZ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["S"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/ledgerguard/src", "apps", "migrations", "scripts", "tests"]
explicit_package_bases = true
mypy_path = ["packages/ledgerguard/src", "."]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "testcontainers.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (Testcontainers); deselect with -m 'not integration'",
]
filterwarnings = [
    # Starlette suggests a renamed httpx fork; we stay on the established httpx package.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
